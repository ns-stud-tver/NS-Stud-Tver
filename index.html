        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 5v14M5 12h14" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M6 18L18 6M6 6l12 12" />,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
        pin: <><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></>,
        phone: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
        star: <path fill="currentColor" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />,
        lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
        copy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        send: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M14 5l7 7m0 0l-7 7m7-7H3" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.6" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return window.__NS_DEFAULT_DATA__;
      });

      const [orders, setOrders] = useState(() => {
        try {
          const saved = localStorage.getItem(ORDERS_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return [];
      });

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }, [data]);

      useEffect(() => {
        try { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); } catch (e) {}
      }, [orders]);

      // Клиентские состояния
      const [activeCategory, setActiveCategory] = useState("nails");
      const [selectedIds, setSelectedIds] = useState([]);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [bookingMasterId, setBookingMasterId] = useState("darina");
      const [customTime, setCustomTime] = useState("");
      const [clientName, setClientName] = useState("");
      const [clientPhone, setClientPhone] = useState("");
      const [clientComment, setClientComment] = useState("");
      const [isBookingOpen, setIsBookingOpen] = useState(false);
      const [bookingStep, setBookingStep] = useState("form");
      const [lastFormattedMsg, setLastFormattedMsg] = useState("");
      const [lastTargetMaster, setLastTargetMaster] = useState(null);
      const [promoDismissed, setPromoDismissed] = useState(false);
      const [toastMsg, setToastMsg] = useState("");

      // Админка
      const [logoTapCount, setLogoTapCount] = useState(0);
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const [pinError, setPinError] = useState(false);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [adminTab, setAdminTab] = useState("slots");

      // Добавление в админке
      const [newSlotMaster, setNewSlotMaster] = useState("darina");
      const [newSlotDay, setNewSlotDay] = useState("Сегодня");
      const [newSlotTime, setNewSlotTime] = useState("16:00");
      const [newSlotLabel, setNewSlotLabel] = useState("Маникюр (Дарина)");

      const [newService, setNewService] = useState({
        category: "nails",
        masterId: "darina",
        title: "",
        desc: "",
        price: 1500,
        duration: 60,
        popular: false
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(""), 3200);
      };

      const isOpenNow = useMemo(() => {
        try {
          const now = new Date();
          const tverTime = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
          const hour = tverTime.getHours();
          return hour >= data.settings.openHour && hour < data.settings.closeHour;
        } catch (e) {
          return true;
        }
      }, [data.settings]);

      const selectedServices = useMemo(() => {
        return data.services.filter((s) => selectedIds.includes(s.id));
      }, [data.services, selectedIds]);

      const totalPrice = useMemo(() => {
        return selectedServices.reduce((sum, s) => sum + Number(s.price || 0), 0);
      }, [selectedServices]);

      const totalDuration = useMemo(() => {
        return selectedServices.reduce((sum, s) => sum + Number(s.duration || 0), 0);
      }, [selectedServices]);

      // Определение мастера на основе выбранных услуг
      const effectiveMasterId = useMemo(() => {
        if (selectedServices.length > 0) {
          const firstSelected = selectedServices[0];
          if (firstSelected && firstSelected.masterId) {
            return firstSelected.masterId;
          }
        }
        if (selectedSlot && selectedSlot.masterId) {
          return selectedSlot.masterId;
        }
        return bookingMasterId;
      }, [selectedServices, selectedSlot, bookingMasterId]);

      const currentMaster = useMemo(() => {
        return data.masters[effectiveMasterId] || data.masters.darina;
      }, [data.masters, effectiveMasterId]);

      const toggleService = (id) => {
        const srv = data.services.find(s => s.id === id);
        if (srv) {
          setBookingMasterId(srv.masterId);
        }
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleSlotQuickPick = (slot) => {
        setSelectedSlot(slot);
        setBookingMasterId(slot.masterId);
        setBookingStep("form");
        setIsBookingOpen(true);
      };

      const handleLogoTap = () => {
        setLogoTapCount((prev) => {
          const next = prev + 1;
          if (next >= 3) {
            setIsPinModalOpen(true);
            return 0;
          }
          setTimeout(() => setLogoTapCount(0), 1200);
          return next;
        });
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === ADMIN_PIN) {
          setIsPinModalOpen(false);
          setPinInput("");
          setPinError(false);
          setIsAdminOpen(true);
        } else {
          setPinError(true);
          setPinInput("");
        }
      };

      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        if (!clientName.trim() || !clientPhone.trim()) return;

        const masterObj = currentMaster;
        setLastTargetMaster(masterObj);

        const servicesListText =
          selectedServices.length > 0
            ? selectedServices.map((s) => `• ${s.title} (${s.price} ₽)`).join("\n")
            : `• Запись на ${masterObj.specialty.toLowerCase()}`;

        const timeChoice = selectedSlot
          ? `${selectedSlot.day}, ${selectedSlot.time}`
          : customTime || "Ближайшее свободное время";

        const messageText = [
          `✨ Новая запись — ${data.settings.salonName}`,
          `👩‍🎨 Мастер: ${masterObj.name} (${masterObj.specialty})`,
          `👤 Клиент: ${clientName.trim()} (${clientPhone.trim()})`,
          `💅 Услуги:\n${servicesListText}`,
          selectedServices.length > 0
            ? `💰 Ориентир стоимости: ${totalPrice.toLocaleString("ru-RU")} ₽ (~${totalDuration} мин)`
            : null,
          `🕒 Желаемое время: ${timeChoice}`,
          clientComment.trim() ? `💬 Пожелания: ${clientComment.trim()}` : null
        ]
          .filter(Boolean)
          .join("\n");

        setLastFormattedMsg(messageText);

        const newOrder = {
          id: "ord_" + Date.now(),
          createdAt: new Date().toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }),
          masterName: masterObj.name,
          clientName: clientName.trim(),
          clientPhone: clientPhone.trim(),
          services: selectedServices.map((s) => s.title),
          totalPrice,
          timeChoice,
          comment: clientComment.trim(),
          status: "Новая"
        };
        setOrders((prev) => [newOrder, ...prev]);

        try {
          await navigator.clipboard.writeText(messageText);
        } catch (err) {}

        if (masterObj.maxWebhookUrl && masterObj.maxWebhookUrl.trim() !== "") {
          try {
            fetch(masterObj.maxWebhookUrl.trim(), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                text: messageText,
                phone: masterObj.phoneRaw,
                order: newOrder
              })
            }).catch(() => {});
          } catch (err) {}
        }

        setBookingStep("success");
      };

      const openMaxMessenger = () => {
        try {
          navigator.clipboard.writeText(lastFormattedMsg);
        } catch (e) {}
        const masterObj = lastTargetMaster || currentMaster;
        const targetUrl =
          masterObj.maxInviteLink && masterObj.maxInviteLink.trim() !== ""
            ? masterObj.maxInviteLink.trim()
            : "https://max.ru";
        window.open(targetUrl, "_blank", "noopener,noreferrer");
      };

      const exportUpdatedHtmlFile = () => {
        try {
          const docClone = document.documentElement.cloneNode(true);
          const rootDiv = docClone.querySelector("#root");
          if (rootDiv) rootDiv.innerHTML = "";
          const dataScript = docClone.querySelector("#ns-initial-data");
          if (dataScript) {
            dataScript.textContent = `\n    window.__NS_FALLBACK_IMG__ = ${JSON.stringify(window.__NS_FALLBACK_IMG__)};\n    window.__NS_DEFAULT_DATA__ = ${JSON.stringify(data, null, 2)};\n  `;
          }
          const finalHtml = "<!DOCTYPE html>\n" + docClone.outerHTML;
          const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "index.html";
          a.click();
          URL.revokeObjectURL(url);
          showToast("Готовый файл index.html скачан!");
        } catch (err) {
          showToast("Ошибка при экспорте файла");
        }
      };

      return (
        <div className="min-h-screen flex flex-col pb-28">
          {/* TOAST УВЕДОМЛЕНИЕ */}
          {toastMsg && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-graphite text-milk text-xs font-medium px-4 py-2.5 rounded-full shadow-lg animate-fade">
              {toastMsg}
            </div>
          )}

          {/* АКЦИОННАЯ ПЛАШКА */}
          {data.blocks.showPromoBanner && !promoDismissed && (
            <div className="bg-graphite text-milk px-4 py-2.5 text-xs">
              <div className="max-w-2xl mx-auto flex items-center justify-between gap-3">
                <div className="flex items-center gap-2 leading-snug">
                  <span className="bg-sage text-white px-2 py-0.5 rounded text-[10px] uppercase tracking-wider font-semibold shrink-0">
                    {data.blocks.promoBadge}
                  </span>
                  <span className="text-milk/90">{data.blocks.promoText}</span>
                </div>
                <button
                  onClick={() => setPromoDismissed(true)}
                  className="text-milk/60 hover:text-milk p-1 shrink-0"
                  aria-label="Закрыть баннер"
                >
                  <Icon name="close" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

          {/* ШАПКА */}
          <header className="sticky top-0 z-30 bg-milk/90 backdrop-blur-md border-b border-borderWarm">
            <div className="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
              <div
                onClick={handleLogoTap}
                className="flex items-center gap-3 cursor-pointer select-none"
                title="NS Studio — нажмите 3 раза для входа в панель"
              >
                <div className="w-10 h-10 rounded-full bg-graphite text-milk flex items-center justify-center font-serif text-xl tracking-wider font-semibold">
                  NS
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-sm tracking-tight text-graphite">
                      {data.settings.salonName}
                    </span>
                    <span className="inline-flex items-center gap-1 text-[11px] text-muted bg-sand px-2 py-0.5 rounded-full">
                      <Icon name="star" className="w-3 h-3 text-terracotta" />
                      {data.settings.rating}
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5 text-[11px] text-muted">
                    <span
                      className={`w-1.5 h-1.5 rounded-full ${
                        isOpenNow ? "bg-emerald-600" : "bg-amber-500"
                      }`}
                    />
                    <span>
                      {isOpenNow ? "Сейчас открыто • до 21:00" : data.settings.hoursText}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <a
                  href="#location"
                  className="text-xs font-medium text-graphite bg-sand hover:bg-borderWarm/70 px-3 py-2 rounded-full transition flex items-center gap-1.5"
                >
                  <Icon name="pin" className="w-3.5 h-3.5 text-terracotta" />
                  <span className="hidden xs:inline">Орджоникидзе, 44</span>
                  <span className="xs:hidden">Адрес</span>
                </a>
                <a
                  href={`tel:${data.masters.darina.phoneRaw}`}
                  className="w-9 h-9 rounded-full bg-sand hover:bg-borderWarm/70 flex items-center justify-center text-graphite transition"
                  title="Позвонить в студию"
                >
                  <Icon name="phone" className="w-4 h-4" />
                </a>
              </div>
            </div>
          </header>

          {/* КОНТЕНТ */}
          <main className="max-w-2xl mx-auto w-full px-4 pt-6 space-y-10 flex-1">
            {/* HERO */}
            <section className="space-y-5">
              <div className="inline-flex items-center gap-2 text-xs text-muted bg-sand/80 border border-borderWarm px-3 py-1 rounded-full">
                <span>{data.settings.city}, {data.settings.address}</span>
                <span>•</span>
                <span>{data.settings.district}</span>
              </div>

              <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight leading-[1.15] text-graphite">
                Маникюр, ресницы и макияж <br />
                <span className="font-serif italic font-normal text-4xl sm:text-5xl text-sage">
                  с безупречной эстетикой
                </span>
              </h1>

              <p className="text-sm sm:text-base text-muted leading-relaxed">
                {data.settings.heroSubtitle}
              </p>

              {/* Карточки трех мастеров */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                <div
                  onClick={() => {
                    setActiveCategory("nails");
                    setBookingMasterId("darina");
                  }}
                  className="bg-white border border-borderWarm rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-graphite/40 transition shadow-xs"
                >
                  <div className="space-y-0.5">
                    <span className="text-[10px] uppercase tracking-wider font-semibold text-sage">Маникюр</span>
                    <h3 className="text-base font-bold text-graphite">Дарина</h3>
                    <p className="text-xs text-muted">{data.masters.darina.phoneDisplay}</p>
                  </div>
                  <span className="text-xs bg-sand text-graphite font-semibold px-3 py-1.5 rounded-full text-center mt-3">
                    Прайс →
                  </span>
                </div>

                <div
                  onClick={() => {
                    setActiveCategory("brows_lashes");
                    setBookingMasterId("natalia");
                  }}
                  className="bg-white border border-borderWarm rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-graphite/40 transition shadow-xs"
                >
                  <div className="space-y-0.5">
                    <span className="text-[10px] uppercase tracking-wider font-semibold text-terracotta">Ресницы и Брови</span>
                    <h3 className="text-base font-bold text-graphite">Наталья</h3>
                    <p className="text-xs text-muted">{data.masters.natalia.phoneDisplay}</p>
                  </div>
                  <span className="text-xs bg-sand text-graphite font-semibold px-3 py-1.5 rounded-full text-center mt-3">
                    Прайс →
                  </span>
                </div>

                <div
                  onClick={() => {
                    setActiveCategory("makeup_hair");
                    setBookingMasterId("elizaveta");
                  }}
                  className="bg-white border border-borderWarm rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-graphite/40 transition shadow-xs"
                >
                  <div className="space-y-0.5">
                    <span className="text-[10px] uppercase tracking-wider font-semibold text-sage">Визаж и Прически</span>
                    <h3 className="text-base font-bold text-graphite">Елизавета</h3>
                    <p className="text-xs text-muted">{data.masters.elizaveta.phoneDisplay}</p>
                  </div>
                  <span className="text-xs bg-sand text-graphite font-semibold px-3 py-1.5 rounded-full text-center mt-3">
                    Прайс →
                  </span>
                </div>
              </div>

              {/* Главный баннер */}
              <div className="relative rounded-2xl overflow-hidden border border-borderWarm bg-sand aspect-[16/10] sm:aspect-[16/9]">
                <img
                  src={data.gallery[3]?.url || window.__NS_FALLBACK_IMG__}
                  alt="Студия красоты NS Тверь"
                  onError={(e) => {
                    e.currentTarget.onerror = null;
                    e.currentTarget.src = window.__NS_FALLBACK_IMG__;
                  }}
                  className="w-full h-full object-cover"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-black/65 via-black/20 to-transparent flex flex-col justify-end p-4 sm:p-6 text-white">
                  <div className="flex items-end justify-between gap-4">
                    <div>
                      <p className="text-[11px] uppercase tracking-widest text-white/80 mb-1">
                        Стерильность по СанПиН • Гарантия 7 дней
                      </p>
                      <p className="text-base sm:text-lg font-medium">
                        Онлайн-запись к Дарине, Наталье и Елизавете в MAX
                      </p>
                    </div>
                    <button
                      onClick={() => {
                        setBookingStep("form");
                        setIsBookingOpen(true);
                      }}
                      className="bg-milk text-graphite hover:bg-white text-xs font-semibold px-4 py-2.5 rounded-full shrink-0 transition shadow-sm"
                    >
                      Записаться
                    </button>
                  </div>
                </div>
              </div>
            </section>

            {/* ГОРЯЩИЕ ОКОШКИ */}
            {data.blocks.showHotSlots && data.hotSlots.length > 0 && (
              <section className="bg-sand/70 border border-borderWarm rounded-2xl p-4 sm:p-5 space-y-3.5">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-terracotta animate-pulse" />
                    <h2 className="text-sm font-semibold tracking-tight uppercase text-graphite">
                      Ближайшие свободные окошки
                    </h2>
                  </div>
                  <span className="text-[11px] text-muted">Кликните для быстрой записи</span>
                </div>

                <div className="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
                  {data.hotSlots.map((slot) => {
                    const isSelected = selectedSlot && selectedSlot.id === slot.id;
                    return (
                      <button
                        key={slot.id}
                        onClick={() => handleSlotQuickPick(slot)}
                        className={`shrink-0 text-left px-3.5 py-2.5 rounded-xl border transition active:scale-95 ${
                          isSelected
                            ? "bg-graphite text-milk border-graphite"
                            : "bg-white hover:border-graphite/40 text-graphite border-borderWarm"
                        }`}
                      >
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-medium opacity-75">{slot.day}</span>
                          <span className="text-sm font-bold">{slot.time}</span>
                        </div>
                        <div className="text-[11px] opacity-75 mt-0.5">{slot.label}</div>
                      </button>
                    );
                  })}
                </div>
              </section>
            )}

            {/* ПРАЙС-КОНСТРУКТОР */}
            <section id="services" className="space-y-4">
              <div className="flex items-end justify-between">
                <div>
                  <h2 className="text-2xl font-semibold tracking-tight">Услуги и цены</h2>
                  <p className="text-xs text-muted mt-0.5">
                    Выберите категорию мастера и отметьте нужные процедуры «+»
                  </p>
                </div>
                {selectedIds.length > 0 && (
                  <button
                    onClick={() => setSelectedIds([])}
                    className="text-xs text-terracotta underline"
                  >
                    Сбросить ({selectedIds.length})
                  </button>
                )}
              </div>

              {/* Табы мастеров */}
              <div className="flex gap-2 p-1 bg-sand/80 border border-borderWarm rounded-2xl overflow-x-auto no-scrollbar">
                {data.categories.map((cat) => {
                  const active = activeCategory === cat.id;
                  const countInCat = data.services.filter(
                    (s) => s.category === cat.id && selectedIds.includes(s.id)
                  ).length;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setActiveCategory(cat.id);
                        setBookingMasterId(cat.masterId);
                      }}
                      className={`shrink-0 flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-2 ${
                        active
                          ? "bg-white text-graphite shadow-sm"
                          : "text-muted hover:text-graphite"
                      }`}
                    >
                      <span>{cat.name}</span>
                      {countInCat > 0 && (
                        <span className="w-5 h-5 rounded-full bg-sage text-white text-[10px] flex items-center justify-center">
                          {countInCat}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* Инфо о текущем мастере */}
              <div className="bg-sand/40 border border-borderWarm/80 rounded-xl px-3.5 py-2 flex items-center justify-between text-xs text-muted">
                <span>
                  Запись к: <strong className="text-graphite">{data.masters[bookingMasterId]?.name}</strong> ({data.masters[bookingMasterId]?.specialty})
                </span>
                <a
                  href={`tel:${data.masters[bookingMasterId]?.phoneRaw}`}
                  className="font-semibold text-graphite underline"
                >
                  {data.masters[bookingMasterId]?.phoneDisplay}
                </a>
              </div>

              {/* Список услуг */}
              <div className="space-y-2.5">
                {data.services
                  .filter((s) => s.category === activeCategory)
                  .map((service) => {
                    const isChecked = selectedIds.includes(service.id);
                    return (
                      <div
                        key={service.id}
                        onClick={() => toggleService(service.id)}
                        className={`group cursor-pointer rounded-2xl p-4 border transition select-none flex items-start justify-between gap-3.5 ${
                          isChecked
                            ? "bg-white border-sage ring-1 ring-sage/30 shadow-sm"
                            : "bg-white/80 hover:bg-white border-borderWarm"
                        }`}
                      >
                        <div className="space-y-1 flex-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <h3 className="text-sm sm:text-base font-semibold text-graphite leading-snug">
                              {service.title}
                            </h3>
                            {service.popular && (
                              <span className="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-sand text-sage">
                                Хит
                              </span>
                            )}
                          </div>
                          {service.desc && (
                            <p className="text-xs text-muted leading-relaxed">{service.desc}</p>
                          )}
                          <div className="flex items-center gap-3 pt-1 text-xs text-muted">
                            <span className="font-semibold text-sm text-graphite">
                              {service.price === 0 ? "Бесплатно" : `${Number(service.price).toLocaleString("ru-RU")} ₽`}
                            </span>
                            <span>•</span>
                            <span className="inline-flex items-center gap-1">
                              <Icon name="clock" className="w-3.5 h-3.5" />~{service.duration} мин
                            </span>
                          </div>
                        </div>

                        <button
                          type="button"
                          aria-label="Выбрать услугу"
                          className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 transition mt-0.5 ${
                            isChecked
                              ? "bg-sage text-white"
                              : "bg-sand text-graphite group-hover:bg-borderWarm"
                          }`}
                        >
                          <Icon name={isChecked ? "check" : "plus"} className="w-4 h-4" />
                        </button>
                      </div>
                    );
                  })}
              </div>
            </section>

            {/* ПРЕИМУЩЕСТВА */}
            <section className="space-y-4">
              <h2 className="text-2xl font-semibold tracking-tight">Сервис и стандарты</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="bg-sand/60 border border-borderWarm rounded-2xl p-4 space-y-1.5">
                  <div className="w-8 h-8 rounded-full bg-white flex items-center justify-center text-sage">
                    <Icon name="shield" className="w-4 h-4" />
                  </div>
                  <h3 className="text-sm font-semibold">Стерильность 100%</h3>
                  <p className="text-xs text-muted leading-relaxed">
                    Крафт-пакет со стерильным инструментом вскрывается строго в присутствии клиента.
                  </p>
                </div>

                <div className="bg-sand/60 border border-borderWarm rounded-2xl p-4 space-y-1.5">
                  <div className="w-8 h-8 rounded-full bg-white flex items-center justify-center text-terracotta">
                    <Icon name="sparkles" className="w-4 h-4" />
                  </div>
                  <h3 className="text-sm font-semibold">Комфорт без потока</h3>
                  <p className="text-xs text-muted leading-relaxed">
                    Анатомическая кушетка для ресниц, мягкие кресла, натуральный кофе и чай.
                  </p>
                </div>

                <div className="bg-sand/60 border border-borderWarm rounded-2xl p-4 space-y-1.5">
                  <div className="w-8 h-8 rounded-full bg-white flex items-center justify-center text-graphite">
                    <Icon name="check" className="w-4 h-4" />
                  </div>
                  <h3 className="text-sm font-semibold">Гарантия 7 дней</h3>
                  <p className="text-xs text-muted leading-relaxed">
                    Качественные материалы премиум-класса и официальная гарантия на покрытие ногтей.
                  </p>
                </div>
              </div>
            </section>

            {/* ГАЛЕРЕЯ */}
            {data.blocks.showGallery && data.gallery.length > 0 && (
              <section className="space-y-4">
                <div className="flex items-end justify-between">
                  <div>
                    <h2 className="text-2xl font-semibold tracking-tight">Работы мастеров</h2>
                    <p className="text-xs text-muted mt-0.5">Дарина, Наталья и Елизавета</p>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {data.gallery.map((item) => (
                    <div
                      key={item.id}
                      className="relative rounded-2xl overflow-hidden border border-borderWarm aspect-square bg-sand group"
                    >
                      <img
                        src={item.url}
                        alt={item.tag}
                        loading="lazy"
                        onError={(e) => {
                          e.currentTarget.onerror = null;
                          e.currentTarget.src = window.__NS_FALLBACK_IMG__;
                        }}
                        className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                      />
                      <div className="absolute bottom-2 left-2 right-2 bg-black/60 text-white text-[11px] px-2.5 py-1 rounded-lg truncate">
                        {item.tag}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* ОТЗЫВЫ */}
            {data.blocks.showReviews && (
              <section className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-semibold tracking-tight">Отзывы гостей</h2>
                    <p className="text-xs text-muted mt-0.5">{data.settings.reviewsCount}</p>
                  </div>
                  <div className="flex items-center gap-1.5 bg-white border border-borderWarm px-3 py-1.5 rounded-full">
                    <Icon name="star" className="w-4 h-4 text-terracotta" />
                    <span className="text-sm font-bold">{data.settings.rating}</span>
                    <span className="text-xs text-muted">/ 5.0</span>
                  </div>
                </div>

                <div className="space-y-3">
                  {data.reviews.map((rev) => (
                    <div
                      key={rev.id}
                      className="bg-white border border-borderWarm rounded-2xl p-4 space-y-2"
                    >
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-semibold text-graphite">{rev.author}</span>
                        <span className="text-muted">{rev.date}</span>
                      </div>
                      <p className="text-xs sm:text-sm text-graphite/85 leading-relaxed">
                        «{rev.text}»
                      </p>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* КОНТАКТЫ МАСТЕРОВ И КАРТА */}
            <section id="location" className="bg-white border border-borderWarm rounded-2xl p-5 space-y-4">
              <div className="space-y-1">
                <span className="text-[11px] uppercase tracking-widest text-sage font-semibold">
                  Контакты мастеров
                </span>
                <h2 className="text-xl font-semibold">Ждём вас в студии NS</h2>
              </div>

              {/* Прямые контакты всех трех мастеров */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                <div className="bg-sand/60 border border-borderWarm rounded-xl p-3.5 space-y-1.5">
                  <div className="text-xs font-semibold text-graphite flex items-center justify-between">
                    <span>💅 Дарина</span>
                    <span className="text-[10px] text-muted">Маникюр</span>
                  </div>
                  <a href={`tel:${data.masters.darina.phoneRaw}`} className="text-sm font-bold block text-graphite">
                    {data.masters.darina.phoneDisplay}
                  </a>
                  <p className="text-[11px] text-muted">MAX чат</p>
                </div>

                <div className="bg-sand/60 border border-borderWarm rounded-xl p-3.5 space-y-1.5">
                  <div className="text-xs font-semibold text-graphite flex items-center justify-between">
                    <span>👁️ Наталья</span>
                    <span className="text-[10px] text-muted">Брови/Ресницы</span>
                  </div>
                  <a href={`tel:${data.masters.natalia.phoneRaw}`} className="text-sm font-bold block text-graphite">
                    {data.masters.natalia.phoneDisplay}
                  </a>
                  <p className="text-[11px] text-muted">MAX чат</p>
                </div>

                <div className="bg-sand/60 border border-borderWarm rounded-xl p-3.5 space-y-1.5">
                  <div className="text-xs font-semibold text-graphite flex items-center justify-between">
                    <span>💄 Елизавета</span>
                    <span className="text-[10px] text-muted">Визаж/Прически</span>
                  </div>
                  <a href={`tel:${data.masters.elizaveta.phoneRaw}`} className="text-sm font-bold block text-graphite">
                    {data.masters.elizaveta.phoneDisplay}
                  </a>
                  <p className="text-[11px] text-muted">MAX чат</p>
                </div>
              </div>

              <div className="space-y-2.5 text-sm pt-2">
                <div className="flex items-start gap-2.5">
                  <Icon name="pin" className="w-4 h-4 text-terracotta shrink-0 mt-1" />
                  <div>
                    <div className="font-medium">
                      {data.settings.city}, {data.settings.address}
                    </div>
                    <div className="text-xs text-muted">{data.settings.district} • парковка рядом со студией</div>
                  </div>
                </div>

                <div className="flex items-center gap-2.5">
                  <Icon name="clock" className="w-4 h-4 text-sage shrink-0" />
                  <span>{data.settings.hoursText}</span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2.5 pt-2">
                <a
                  href={data.settings.yandexMapsUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="bg-sand hover:bg-borderWarm/80 text-graphite text-xs font-semibold py-3 px-3 rounded-xl text-center transition"
                >
                  Яндекс.Карты
                </a>
                <a
                  href={data.settings.dgisUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="bg-sand hover:bg-borderWarm/80 text-graphite text-xs font-semibold py-3 px-3 rounded-xl text-center transition"
                >
                  2ГИС
                </a>
              </div>
            </section>
          </main>

          {/* ПОДВАЛ */}
          <footer className="max-w-2xl mx-auto w-full px-4 pt-10 pb-6 text-xs text-muted flex items-center justify-between">
            <div>
              © {new Date().getFullYear()} {data.settings.salonName} • {data.settings.address}
            </div>
            <button
              onClick={() => setIsPinModalOpen(true)}
              className="opacity-15 hover:opacity-80 transition p-1.5 text-graphite"
              aria-label="Панель управления"
              title="Управление студией"
            >
              <Icon name="lock" className="w-3.5 h-3.5" />
            </button>
          </footer>

          {/* НИЖНЯЯ ЗАКРЕПЛЕННАЯ ПЛАШКА */}
          <div className="fixed bottom-0 inset-x-0 z-40 bg-milk/95 backdrop-blur-md border-t border-borderWarm px-4 py-3 shadow-lg">
            <div className="max-w-2xl mx-auto flex items-center justify-between gap-3">
              {selectedIds.length > 0 ? (
                <div>
                  <div className="text-xs text-muted">
                    К мастеру <strong className="text-graphite">{currentMaster.name}</strong> • {selectedIds.length} усл.
                  </div>
                  <div className="text-base font-bold text-graphite">
                    {totalPrice.toLocaleString("ru-RU")} ₽
                  </div>
                </div>
              ) : (
                <div>
                  <div className="text-xs font-medium text-graphite flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-sage" />
                    Запись к мастерам NS
                  </div>
                  <div className="text-[11px] text-muted">
                    {selectedSlot ? `Окошко: ${selectedSlot.day}, ${selectedSlot.time}` : "Без звонков через мессенджер MAX"}
                  </div>
                </div>
              )}

              <button
                onClick={() => {
                  setBookingStep("form");
                  setIsBookingOpen(true);
                }}
                className="bg-sage hover:bg-sageDark active:scale-95 text-white text-xs sm:text-sm font-semibold px-5 py-3.5 rounded-full transition flex items-center gap-2 shadow-sm shrink-0"
              >
                <span>Записаться в MAX</span>
                <Icon name="send" className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* НИЖНЯЯ ШТОРКА ЗАПИСИ (BOTTOM SHEET) */}
          {isBookingOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end justify-center">
              <div className="bg-milk w-full max-w-xl rounded-t-3xl border-t border-borderWarm p-5 sm:p-6 max-h-[90vh] overflow-y-auto animate-sheet space-y-5">
                <div className="flex items-center justify-between border-b border-borderWarm pb-3">
                  <div>
                    <h3 className="text-lg font-semibold text-graphite">
                      {bookingStep === "form" ? "Запись в студию NS" : "Заявка сформирована"}
                    </h3>
                    <p className="text-xs text-muted">
                      Мастер: <strong className="text-graphite">{currentMaster.name}</strong> ({currentMaster.specialty})
                    </p>
                  </div>
                  <button
                    onClick={() => setIsBookingOpen(false)}
                    className="w-8 h-8 rounded-full bg-sand flex items-center justify-center text-graphite"
                  >
                    <Icon name="close" className="w-4 h-4" />
                  </button>
                </div>

                {bookingStep === "form" ? (
                  <form onSubmit={handleBookingSubmit} className="space-y-4">
                    {/* Переключатель мастера внутри формы */}
                    <div className="space-y-1.5">
                      <label className="text-xs font-semibold text-graphite block">
                        К какому мастеру оформляем запись:
                      </label>
                      <div className="grid grid-cols-3 gap-2">
                        <button
                          type="button"
                          onClick={() => setBookingMasterId("darina")}
                          className={`py-2 px-2 rounded-xl text-[11px] font-semibold border text-center transition ${
                            effectiveMasterId === "darina"
                              ? "bg-graphite text-milk border-graphite"
                              : "bg-white text-graphite border-borderWarm"
                          }`}
                        >
                          💅 Дарина
                        </button>
                        <button
                          type="button"
                          onClick={() => setBookingMasterId("natalia")}
                          className={`py-2 px-2 rounded-xl text-[11px] font-semibold border text-center transition ${
                            effectiveMasterId === "natalia"
                              ? "bg-graphite text-milk border-graphite"
                              : "bg-white text-graphite border-borderWarm"
                          }`}
                        >
                          👁️ Наталья
                        </button>
                        <button
                          type="button"
                          onClick={() => setBookingMasterId("elizaveta")}
                          className={`py-2 px-2 rounded-xl text-[11px] font-semibold border text-center transition ${
                            effectiveMasterId === "elizaveta"
                              ? "bg-graphite text-milk border-graphite"
                              : "bg-white text-graphite border-borderWarm"
                          }`}
                        >
                          💄 Елизавета
                        </button>
                      </div>
                    </div>

                    {/* Сводка услуг */}
                    <div className="bg-sand/70 border border-borderWarm rounded-2xl p-3.5 space-y-2">
                      <div className="flex items-center justify-between text-xs font-semibold">
                        <span>Выбранные услуги ({selectedServices.length})</span>
                        {selectedServices.length > 0 && (
                          <span>{totalPrice.toLocaleString("ru-RU")} ₽</span>
                        )}
                      </div>
                      {selectedServices.length > 0 ? (
                        <ul className="text-xs text-muted space-y-1">
                          {selectedServices.map((s) => (
                            <li key={s.id} className="flex justify-between">
                              <span>• {s.title}</span>
                              <span>{s.price === 0 ? "Бесплатно" : `${s.price} ₽`}</span>
                            </li>
                          ))}
                        </ul>
                      ) : (
                        <p className="text-xs text-muted">
                          Услуги не выбраны — мастер поможет определиться прямо в чате.
                        </p>
                      )}
                    </div>

                    {/* Выбор окошка */}
                    {data.hotSlots.length > 0 && (
                      <div className="space-y-1.5">
                        <label className="text-xs font-semibold text-graphite block">
                          Свободное окошко (или укажите дату ниже):
                        </label>
                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                          {data.hotSlots.map((slot) => {
                            const isSlotActive = selectedSlot && selectedSlot.id === slot.id;
                            return (
                              <button
                                type="button"
                                key={slot.id}
                                onClick={() => {
                                  setSelectedSlot(isSlotActive ? null : slot);
                                  if (!isSlotActive) setBookingMasterId(slot.masterId);
                                }}
                                className={`shrink-0 px-3 py-1.5 rounded-xl text-xs border transition ${
                                  isSlotActive
                                    ? "bg-graphite text-milk border-graphite"
                                    : "bg-white text-graphite border-borderWarm"
                                }`}
                              >
                                {slot.day} <strong>{slot.time}</strong> ({data.masters[slot.masterId]?.name})
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-medium text-muted block mb-1">
                          Ваше имя *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="Анна"
                          value={clientName}
                          onChange={(e) => setClientName(e.target.value)}
                          className="w-full bg-white border border-borderWarm rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-graphite"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-medium text-muted block mb-1">
                          Телефон для связи *
                        </label>
                        <input
                          type="tel"
                          required
                          placeholder="+7 (9__) ___-__-__"
                          value={clientPhone}
                          onChange={(e) => setClientPhone(e.target.value)}
                          className="w-full bg-white border border-borderWarm rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-graphite"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-medium text-muted block mb-1">
                          Желаемое время
                        </label>
                        <input
                          type="text"
                          placeholder={selectedSlot ? `${selectedSlot.day}, ${selectedSlot.time}` : "Например: Завтра в 15:00"}
                          value={customTime}
                          onChange={(e) => setCustomTime(e.target.value)}
                          className="w-full bg-white border border-borderWarm rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-graphite"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-medium text-muted block mb-1">
                          Пожелания к записи
                        </label>
                        <input
                          type="text"
                          placeholder="Длина, особенности..."
                          value={clientComment}
                          onChange={(e) => setClientComment(e.target.value)}
                          className="w-full bg-white border border-borderWarm rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-graphite"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-sage hover:bg-sageDark text-white font-semibold text-sm py-3.5 rounded-xl transition shadow-sm flex items-center justify-center gap-2"
                    >
                      <span>Отправить заявку в MAX ({currentMaster.name})</span>
                      <Icon name="send" className="w-4 h-4" />
                    </button>
                  </form>
                ) : (
                  /* ШАГ УСПЕХА */
                  <div className="space-y-4 animate-fade">
                    <div className="bg-emerald-900/10 border border-emerald-800/20 rounded-2xl p-4 text-xs space-y-1.5">
                      <div className="font-semibold text-emerald-950 flex items-center gap-1.5 text-sm">
                        <Icon name="check" className="w-4 h-4 text-emerald-700" />
                        Текст записи скопирован в буфер!
                      </div>
                      <p className="text-graphite/85 leading-relaxed">
                        Сейчас откроется чат мессенджера <strong>MAX</strong> с мастером <strong>{lastTargetMaster?.name}</strong> ({lastTargetMaster?.phoneDisplay}) — просто вставьте готовое сообщение в чат.
                      </p>
                    </div>

                    <pre className="bg-white border border-borderWarm rounded-xl p-3 text-xs whitespace-pre-wrap font-sans text-graphite/90 leading-relaxed">
                      {lastFormattedMsg}
                    </pre>

                    <div className="space-y-2.5">
                      <button
                        onClick={openMaxMessenger}
                        className="w-full bg-graphite hover:bg-black text-milk font-semibold text-sm py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm"
                      >
                        <span>Перейти в MAX к мастеру {lastTargetMaster?.name}</span>
                        <Icon name="send" className="w-4 h-4" />
                      </button>

                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => {
                            if (lastTargetMaster) {

                          className="bg-white border border-borderWarm rounded-2xl p-4 space-y-2 text-xs"
                        >
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm">
                              {ord.clientName} ({ord.clientPhone}) → к мастеру {ord.masterName}
                            </span>
                            <span className="text-muted">{ord.createdAt}</span>
                          </div>
                          <div><strong>Время:</strong> {ord.timeChoice}</div>
                          <div>
                            <strong>Услуги:</strong>{" "}
                            {ord.services.length > 0 ? ord.services.join(", ") : "Консультация"}
                          </div>
                          {ord.comment && <div><strong>Пожелания:</strong> {ord.comment}</div>}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
